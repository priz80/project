<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дата и Время</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .date-container {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .result {
            font-size: 1.1em;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="date-container">
        <span class="label">Формат (a):</span>
        <span id="date-format-a" class="result"></span>
    </div>

    <div class="date-container">
        <span class="label">Формат (b):</span>
        <span id="date-format-b" class="result"></span>
    </div>

    <script src="hl-script.js"></script>
</body>

</html>
